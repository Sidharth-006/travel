<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExploreWorld | Booking</title>
<link rel="stylesheet" href="style.css">

<style>

.booking-container {
    max-width: 700px;
    margin: 60px auto;
    background: rgb(210, 205, 205);
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

.booking-container h2 {
    text-align: center;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 20px;
}

.form-grid input,
.form-grid select {
    padding: 10px;
    width: 100%;
}

.full-width {
    grid-column: span 2;
}

button {
    padding: 10px 20px;
    border: none;
    background: #ff6b35;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.summary {
    margin-top: 30px;
    padding: 20px;
    background: #f7f7f7;
    border-radius: 8px;
}
.body{
    background-color: antiquewhite;
}
</style>
</head>

<body>

<header class="navbar">
    <div class="logo">ExploreWorld</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="destinations.html">Destinations</a>
        <a href="contact.html">Contact</a>
        <a href="booking.html">Booking</a>
    </nav>
</header>

<div class="booking-container">

    <h2>Book Your Trip</h2>
    <p style="text-align:center;">Choose a destination and details. Price will be calculated automatically.</p>

    <div class="form-grid">

        <select id="destination">
            <option value="">Select Your Destination</option>
            <option value="1200">Japan</option>
            <option value="1500">New York</option>
            <option value="1800">Switzerland</option>
            <option value="1400">Italy</option>
            <option value="1000">Bali</option>
            <option value="1600">London</option>
        </select>

        <input type="number" id="travelers" placeholder="Number of Travelers">

        <input type="number" id="days" placeholder="Number of Days">

        <select id="extras">
            <option value="0">No Extra Services</option>
            <option value="200">Airport Pickup ($200)</option>
            <option value="300">City Tour ($300)</option>
        </select>

        <input type="text" id="fullName" placeholder="Full Name" class="full-width">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="phone" placeholder="Phone">

        <div class="full-width" style="text-align:center;">
            <button onclick="calculatePrice()">Calculate Price</button>
            <button onclick="confirmBooking()">Confirm Booking</button>
        </div>

    </div>

    <div class="summary" id="summary">
        <h3>Booking Summary</h3>
        <p>Select details and click Calculate Price.</p>
    </div>

</div>

<footer style="text-align:center; padding:20px;">
    ExploreWorld © 2026
</footer>

<script>

let totalPrice = 0;

function calculatePrice() {

    let destination = document.getElementById("destination").value;
    let travelers = document.getElementById("travelers").value;
    let days = document.getElementById("days").value;
    let extras = document.getElementById("extras").value;

    if(destination === "" || travelers === "" || days === "") {
        alert("Please fill required fields");
        return;
    }

    totalPrice = (destination * travelers * days) + parseInt(extras);

    document.getElementById("summary").innerHTML =
        "<h3>Booking Summary</h3>" +
        "<p>Total Price: <strong>$" + totalPrice + "</strong></p>";
}

function confirmBooking() {

    let name = document.getElementById("fullName").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;

    if(name === "" || email === "" || phone === "") {
        alert("Please enter your personal details");
        return;
    }

    document.getElementById("summary").innerHTML =
        "<h3>🎉 Booking Confirmed!</h3>" +
        "<p>Name: " + name + "</p>" +
        "<p>Total Paid: <strong>$" + totalPrice + "</strong></p>";
}

</script>

</body>
</html>
