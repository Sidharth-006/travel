<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExploreWorld | Contact</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">ExploreWorld</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="destinations.html">Destinations</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="contact" style="padding:40px; text-align:center;">
    <h2>Contact Us</h2>

    <form>
        <label>Full Name</label>
        <input type="text" placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Phone</label>
        <input type="number" placeholder="Enter phone number">

        <label>Travel Destination</label>
        <select>
            <option>Maldives</option>
            <option>Paris</option>
            <option>Dubai</option>
        </select>

        <label>Preferred Month</label>
        <div>
            <input type="radio" name="month"> June
            <input type="radio" name="month"> July
            <input type="radio" name="month"> August
        </div>

        <label>Comments</label>
        <textarea rows="4"></textarea>

        <label>
            <input type="checkbox"> Subscribe to newsletter
        </label>

        <button type="submit" class="btn">Submit</button>
    </form>

    <h3>FAQs</h3>

    <details>
        <summary>How do I book a trip?</summary>
        <p>Choose a destination and click Book Now.</p>
    </details>

    <details>
        <summary>Can I cancel my booking?</summary>
        <p>Yes, cancellation policies apply.</p>
    </details>
</section>

<footer style="text-align:center; padding:20px;">
    <p>© 2026 ExploreWorld Travel Agency | All Rights Reserved</p>
</footer>

</body>
</html>
